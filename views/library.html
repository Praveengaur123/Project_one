<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Library Management</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" 
    integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <script defer src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" 
    integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" crossorigin="anonymous"></script>

    <style>
        body {
            background-color: #e89ba6;
            font-family: Arial, sans-serif;
        }

        #book-issued {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;  /* Centers the book cards */
    gap: 15px;  /* Adds space between cards */
    margin-top: 20px;
}

/* Individual Book Container */
.book-container {
    background-color: #ecc6c6;
    border-radius: 10px;
    padding: 15px;
    width: 280px;
    box-shadow: 0px 0px 10px rgba(255, 255, 255, 0.2);
    text-align: left;
}
    </style>
</head>
<body>
    <div class="container mt-5">
        <h3 style="color: aliceblue;">Books</h3>
        <form id="book-form">
            <div class="form-group">
                <label for="bookName"></label>
                <input type="text" id="bookName" placeholder="Please Enter Book name" required>
                <button id="submit" type="submit" class="btn btn-primary">submit</button>
            </div>
        </form>
        <div class=" " id="book-issued">

        </div>
        <div id="returnedBook">
        <h3 class="mt-5">Returned Book</h3>
        
        </div>
    </div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/axios/1.5.1/axios.min.js"></script>
    <script src="../library.js"></script>
</body>
</html>
